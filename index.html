<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Device Display</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #f8f9fa;
        color: #333;
        padding: 20px;
      }
      .device-tabs {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .tab {
        margin-bottom: 30px;
      }
      .fan-item {
        background: #f1f3f5;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .fan-toggle {
        background-color: #6200ff;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        align-self: flex-start;
      }
      .fan-toggle:hover {
        background-color: #4a00c7;
      }
      .slider-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      input[type="range"] {
        cursor: pointer;
        width: 100%;
        max-width: 200px;
      }
      .points-value {
        font-weight: bold;
        color: #6200ff;
        min-width: 15px;
      }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Device Display</h1>
    <p style="text-align: center;">lorem ipsum dolor sit amet</p>

    <div class="device-tabs">
        <!-- Lights Section -->
        <div class="tab" data-category="lights">
            <h2>Lights</h2>
            <p style="color: #666; font-size: 0.9em;">No lights configured yet.</p>
        </div>
        
        <!-- Fans Section -->
        <div class="tab" data-category="fans">
            <h2>Fans</h2>
            <div class="fan-list">
                
                <!-- Fan Control Group 1 -->
                <div class="fan-item">
                    <button class="fan-toggle" data-fan="all">All Fans</button>
                    <div class="slider-container">
                        <label>All Fans Speed:</label>
                        <!-- Changed id="points" to class="points-slider" -->
                        <input type="range" class="points-slider" min="0" max="3" value="1" step="1">
                        <!-- Changed id to class -->
                        <span class="points-value">1</span>
                    </div>
                </div>

                <!-- Fan Control Group 2 -->
                <div class="fan-item">
                    <button class="fan-toggle" data-fan="fan1">Fan 1</button>
                    <div class="slider-container">
                        <label>Fan 1 Speed:</label>
                        <input type="range" class="points-slider" min="0" max="3" value="1" step="1">
                        <span class="points-value">1</span>
                    </div>
                </div>

                <!-- Fan Control Group 3 -->
                <div class="fan-item">
                    <button class="fan-toggle" data-fan="fan2">Fan 2</button>
                    <div class="slider-container">
                        <label>Fan 2 Speed:</label>
                        <input type="range" class="points-slider" min="0" max="3" value="1" step="1">
                        <span class="points-value">1</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
      // 1. Select all slider elements using their new class name
      const sliders = document.querySelectorAll('.points-slider');

      // 2. Loop through each slider and attach an event listener
      sliders.forEach(slider => {
        slider.addEventListener('input', function() {
          // Find the specific span element that lives inside the same container as this slider
          const container = this.parentElement;
          const output = container.querySelector('.points-value');
          
          // Update that specific span text
          output.textContent = this.value;
        });
      });
    </script>

</body>
</html>
